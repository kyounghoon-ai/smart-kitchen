<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>상품기획팀 업무 시스템</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#1a3a5c"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#1a3a5c;--navy-light:#234d7a;--accent:#2e7dcc;
  --accent-light:#e8f2fc;--text:#1e2836;--sub:#6b7a90;
  --border:#dde4ef;--bg:#f4f7fc;--white:#ffffff;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(135deg,#1a3a5c 0%,#234d7a 50%,#1a3a5c 100%);z-index:-1}
body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(46,125,204,.15) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(46,125,204,.1) 0%,transparent 50%);z-index:-1}

.card{background:var(--white);border-radius:20px;padding:48px 44px;width:100%;max-width:420px;box-shadow:0 24px 60px rgba(0,0,0,.18)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.logo-icon{width:44px;height:44px;background:var(--navy);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.logo-text h1{font-size:16px;font-weight:600;color:var(--text)}
.logo-text p{font-size:12px;color:var(--sub);margin-top:2px}
.welcome{margin-bottom:28px}
.welcome h2{font-size:22px;font-weight:600;color:var(--text);margin-bottom:6px}
.welcome p{font-size:13px;color:var(--sub);line-height:1.6}
.form-group{margin-bottom:16px}
label{display:block;font-size:12px;font-weight:500;color:var(--sub);margin-bottom:6px;letter-spacing:.3px}
input[type=email],input[type=password],input[type=text]{
  width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;
  font-size:14px;font-family:inherit;color:var(--text);background:var(--white);outline:none;transition:border-color .2s
}
input[type=email]:focus,input[type=password]:focus,input[type=text]:focus{border-color:var(--accent)}
input::placeholder{color:#b0bac9}

/* 체크박스 옵션 */
.options-row{display:flex;justify-content:space-between;align-items:center;margin:2px 0 18px}
.check-label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);cursor:pointer;user-select:none}
.check-label input[type=checkbox]{width:15px;height:15px;accent-color:var(--navy);cursor:pointer;padding:0;margin:0}
.check-label:hover{color:var(--text)}

.btn{width:100%;padding:13px;background:var(--navy);color:var(--white);border:none;border-radius:10px;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;transition:background .2s,transform .1s}
.btn:hover{background:var(--navy-light)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:default}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0}
.divider span{font-size:12px;color:var(--sub);white-space:nowrap}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.btn-signup{width:100%;padding:12px;background:transparent;color:var(--accent);border:1.5px solid var(--accent);border-radius:10px;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;transition:background .2s}
.btn-signup:hover{background:var(--accent-light)}
.msg{margin-top:14px;padding:10px 14px;border-radius:8px;font-size:12px;text-align:center;display:none}
.msg.error{background:#fdecea;color:#c0392b}
.msg.info{background:#e8f2fc;color:#1a5fa8}
.footer{text-align:center;margin-top:24px;font-size:11px;color:var(--sub)}

/* 자동로그인 오버레이 */
.auto-overlay{position:fixed;inset:0;background:var(--navy);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.auto-overlay p{color:#fff;font-size:14px}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- 자동로그인 오버레이 -->
<div class="auto-overlay" id="autoOverlay">
  <div style="font-size:32px">📋</div>
  <div class="spinner"></div>
  <p>자동 로그인 중...</p>
</div>

<div class="card" id="loginCard">
  <div class="logo">
    <div class="logo-icon">📋</div>
    <div class="logo-text">
      <h1>상품기획팀</h1>
      <p>업무 시스템</p>
    </div>
  </div>

  <div class="welcome">
    <h2>로그인</h2>
    <p>팀원 계정으로 로그인하여<br>업무 시스템을 이용하세요.</p>
  </div>

  <div class="form-group">
    <label>이메일</label>
    <input type="email" id="email" placeholder="이메일 주소 입력"/>
  </div>
  <div class="form-group">
    <label>비밀번호</label>
    <input type="password" id="password" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')login()"/>
  </div>

  <!-- 아이디 저장 + 자동 로그인 -->
  <div class="options-row">
    <label class="check-label">
      <input type="checkbox" id="saveId"/> 아이디 저장
    </label>
    <label class="check-label">
      <input type="checkbox" id="autoLogin"/> 자동 로그인
    </label>
  </div>

  <button class="btn" id="loginBtn" onclick="login()">로그인</button>

  <div class="divider"><span>처음 사용하시나요?</span></div>
  <button class="btn-signup" onclick="showSignup()">회원가입</button>

  <div class="msg" id="msg"></div>
  <div class="footer">상품기획팀 전용 시스템</div>
</div>

<!-- 회원가입 모달 -->
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:20px">
  <div class="card" style="max-width:400px;padding:36px">
    <h2 style="font-size:18px;font-weight:600;color:var(--text);margin-bottom:20px">회원가입</h2>
    <div class="form-group">
      <label>이름</label>
      <input type="text" id="sName" placeholder="실명 입력"/>
    </div>
    <div class="form-group">
      <label>이메일</label>
      <input type="email" id="sEmail" placeholder="이메일 주소"/>
    </div>
    <div class="form-group">
      <label>비밀번호</label>
      <input type="password" id="sPassword" placeholder="6자 이상"/>
    </div>
    <button class="btn" id="signupBtn" onclick="signup()">가입하기</button>
    <div class="msg" id="sMsg"></div>
    <button onclick="closeModal()" style="width:100%;padding:10px;background:none;border:none;color:var(--sub);font-size:13px;cursor:pointer;margin-top:10px">취소</button>
  </div>
</div>

<script type="module">
import { supabase } from './supabase.js';

// ── 저장된 설정 불러오기 ──────────────────
const savedEmail  = localStorage.getItem('saved_email') || '';
const isSaveId    = localStorage.getItem('save_id') === 'true';
const isAutoLogin = localStorage.getItem('auto_login') === 'true';

if (isSaveId && savedEmail) {
  document.getElementById('email').value = savedEmail;
  document.getElementById('saveId').checked = true;
}
if (isAutoLogin) {
  document.getElementById('autoLogin').checked = true;
}

// ── 자동 로그인 ───────────────────────────
async function tryAutoLogin() {
  const { data } = await supabase.auth.getSession();
  if (data.session) {
    if (!isAutoLogin) { await supabase.auth.signOut(); return; }
    document.getElementById('autoOverlay').style.display = 'flex';
    document.getElementById('loginCard').style.display = 'none';
    location.href = 'home.html';
  }
}
tryAutoLogin();

// ── 로그인 ────────────────────────────────
window.login = async () => {
  const email     = document.getElementById('email').value.trim();
  const pw        = document.getElementById('password').value;
  const saveId    = document.getElementById('saveId').checked;
  const autoLogin = document.getElementById('autoLogin').checked;
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('msg');

  if (!email || !pw) { showMsg(msg,'이메일과 비밀번호를 입력해주세요.','error'); return; }
  btn.disabled = true; btn.textContent = '로그인 중...';

  const { data, error } = await supabase.auth.signInWithPassword({ email, password: pw });
  if (error) {
    showMsg(msg,'이메일 또는 비밀번호가 틀렸습니다.','error');
    btn.disabled = false; btn.textContent = '로그인'; return;
  }

  // 설정 저장
  localStorage.setItem('save_id', saveId);
  localStorage.setItem('auto_login', autoLogin);
  if (saveId) localStorage.setItem('saved_email', email);
  else        localStorage.removeItem('saved_email');

  location.href = 'home.html';
};

// ── 회원가입 ──────────────────────────────
window.showSignup  = () => { document.getElementById('modal').style.display = 'flex'; };
window.closeModal  = () => { document.getElementById('modal').style.display = 'none'; };

window.signup = async () => {
  const name  = document.getElementById('sName').value.trim();
  const email = document.getElementById('sEmail').value.trim();
  const pw    = document.getElementById('sPassword').value;
  const btn   = document.getElementById('signupBtn');
  const msg   = document.getElementById('sMsg');
  if (!name||!email||!pw) { showMsg(msg,'모든 항목을 입력해주세요.','error'); return; }
  if (pw.length < 6)      { showMsg(msg,'비밀번호는 6자 이상이어야 합니다.','error'); return; }
  btn.disabled = true; btn.textContent = '가입 중...';
  const { data, error } = await supabase.auth.signUp({ email, password: pw });
  if (error) { showMsg(msg,'가입 실패: '+error.message,'error'); btn.disabled=false; btn.textContent='가입하기'; return; }
  await supabase.from('profiles').insert({ id: data.user.id, name, role: 'member' });
  showMsg(msg,'가입 완료! 로그인해주세요.','info');
  setTimeout(() => closeModal(), 2000);
  btn.disabled = false; btn.textContent = '가입하기';
};

function showMsg(el, text, type) {
  el.textContent = text; el.className = 'msg ' + type; el.style.display = 'block';
}

// PWA 서비스워커
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
